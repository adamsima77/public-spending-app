[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vydavky-etl"
version = "0.1.0"
description = "ETL pipeline pre verejné výdavky"
authors = [
    { name = "Adam Sima" }
]
requires-python = ">=3.10"

dependencies = [
    "httpx>=0.27.0",
    "sparqlwrapper>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "redis>=5.0.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",    # Pre testovanie async funkcií
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]