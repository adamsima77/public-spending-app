services:
  nginx:
    image: nginx:alpine
    container_name: vydavky_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started

  db:
    image: postgres:16-alpine
    container_name: vydavky_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: vydavky_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vydavky_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vydavky_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/var/lib/redis/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vydavky_backend
    restart: always
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:8000" # Temporary for dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www
      - /var/www/vendor

  etl:
    build:
      context: ./etl
      dockerfile: Dockerfile
    container_name: vydavky_etl
    restart: on-failure
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./etl/.env
    volumes:
      - etl_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vydavky_frontend
    restart: always
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend:/app
      - frontend_angular_cache:/app/.angular
      - frontend_node_modules:/app/node_modules
    environment:
      NG_CLI_ANALYTICS: "false"

volumes:
  postgres_data:
  redis_data:
  etl_data:
  frontend_angular_cache:
  frontend_node_modules: