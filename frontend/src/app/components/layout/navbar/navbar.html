@let isSidebarOpen = sidebarService.isSidebarActive();

<nav>
  <span class="icon">Placeholder</span>

  <div class="navigation">
    <ul #links class="links">
      @for (item of navigationConfig(); track item.path) {
        <li>
          <a #navLink [routerLink]="item.path" [class.active]="sidebarService.isActive(item.path)">
            {{ item.label }}
          </a>
        </li>
      }
    </ul>

    @if (indicatorStyle(); as style) {
      <div class="indicator" [style.left]="style.left" [style.width]="style.width"></div>
    }
  </div>

  <div class="icons">
    <svg lucideCircleUser [size]="24" class="user-icon"></svg>

    <button
      mat-icon-button
      type="button"
      class="menu-button"
      (click)="changeSidebarState()"
      [attr.aria-expanded]="isSidebarOpen"
      aria-label="Otvoriť navigáciu"
      aria-controls="sidebar"
    >
      <svg lucideMenu [size]="24" aria-hidden="true"></svg>
    </button>
  </div>
</nav>
