<app-page-card-shell [headerData]="pageHeaderData()">
  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [meta]="meta()"
    [sort]="sortState()"
    [rowLink]="rowLink"
    [pageSizeOptions]="pageSizeOptions"
    [loading]="loading()"
    [rowKey]="rowKey"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
  >
    <app-organization-filters
      filters
      [form]="filterForm"
      [countries]="countryFilters()"
      [companySizes]="companySizeFilters()"
      [roles]="roleFilterOptions"
      [hasActive]="hasActiveFilters()"
    />
  </app-data-table>
</app-page-card-shell>
