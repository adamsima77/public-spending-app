<app-page-card-shell [headerData]="pageHeaderData()">
  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [meta]="meta()"
    [sort]="sortState()"
    [rowLink]="rowLink"
    [pageSizeOptions]="pageSizeOptions"
    [loading]="loading()"
    [error]="error()"
    [reload]="reloadSettledContracts"
    [rowKey]="rowKey"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
  >
    <app-settled-contract-filters filters [form]="filterForm" [buyers]="buyers" />
  </app-data-table>
</app-page-card-shell>
