<mat-form-field appearance="outline" subscriptSizing="dynamic">
  <mat-label>{{ label() }}</mat-label>
  <input matInput [matAutocomplete]="auto" [value]="text()" (input)="onInput($event)" />
  <mat-autocomplete #auto [displayWith]="displayWith" (optionSelected)="onSelected($event)">
    @for (o of options(); track o.value) {
      <mat-option [value]="o">{{ o.label }}</mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
