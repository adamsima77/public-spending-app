@let mainTitle = title() ?? null;

<div class="content-page">
  <mat-card class="content-card" [style.max-width]="maxWidth()">
    <mat-card-header>
      @if (mainTitle) {
        <mat-card-title
          ><h1>{{ mainTitle }}</h1></mat-card-title
        >
      }
    </mat-card-header>

    <mat-card-content>
      <ng-content />
    </mat-card-content>

    <mat-card-actions class="content-actions">
      <ng-content select="[actions]" />
    </mat-card-actions>
  </mat-card>
</div>
