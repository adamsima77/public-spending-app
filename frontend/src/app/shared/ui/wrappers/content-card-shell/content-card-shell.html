<div class="content-page">
  <mat-card class="content-card">
    <mat-card-header>
      <mat-card-title
        ><h1>{{ title() }}</h1></mat-card-title
      >
    </mat-card-header>

    <mat-card-content>
      <ng-content />
    </mat-card-content>

    <mat-card-actions class="content-actions">
      <ng-content select="[actions]" />
    </mat-card-actions>
  </mat-card>
</div>
