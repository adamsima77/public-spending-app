@if (data(); as data) {
  <header class="page-header">
    <div class="header-content">
      <h1 class="title">{{ data.title }}</h1>
      <p class="description">{{ data.description }}</p>
    </div>
  </header>

  <mat-divider />

  @if (data.kpis; as kpis) {
    <section class="kpi-grid" [attr.aria-busy]="data.loading">
      @for (kpi of kpis; track kpi.label) {
        <mat-card appearance="outlined" class="kpi-card" [class.is-loading]="data.loading">
          <mat-card-content class="kpi-content">
            <mat-icon class="kpi-icon">{{ kpi.icon }}</mat-icon>
            <div class="kpi-value">{{ kpi.value }}</div>
            <div class="kpi-label">{{ kpi.label }}</div>
          </mat-card-content>
        </mat-card>
      }
    </section>
  }
}
