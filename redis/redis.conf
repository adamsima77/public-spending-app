# Accept network connections from any available IPv4 interface.
# Note: Ensure appropriate firewall or authentication settings are configured, 
# as exposing this publicly leaves your database accessible to the network.
bind 0.0.0.0

# Run Redis in the foreground instead of as a background daemon.
# Useful for running inside containerized environments like Docker or systemd.
daemonize no

# Save the dataset to disk asynchronously
# Automatically dump the DB to disk if at least 1 key changed within 60 seconds.
save 60 1

# Limit the maximum memory usage of the Redis server to 256 Megabytes.
maxmemory 256mb

# Memory eviction policy when maxmemory is reached.
# Automatically evicts the least recently used (LRU) keys out of all keys to free up space.
maxmemory-policy allkeys-lru