services:
  nginx:
    volumes:
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false

  db:
    ports:
      - "5433:5432"

  redis:
    ports:
      - "6379:6379"

  backend:
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: ./backend
        target: /var/www
        bind:
          create_host_path: false
      - /var/www/vendor

  etl:
    user: "${UID:-1000}:${GID:-1000}"

  frontend:
    build:
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - type: bind
        source: ./frontend
        target: /app
        bind:
          create_host_path: false
      - frontend_angular_cache:/app/.angular
      - frontend_node_modules:/app/node_modules
    environment:
      NG_CLI_ANALYTICS: "false"
      NG_HMR_TEMPLATES: "1"
      CHOKIDAR_USEPOLLING: "false"
      NG_ALLOWED_HOSTS: "localhost"
      NG_TRUST_PROXY_HEADERS: "x-forwarded-proto,x-forwarded-for"

volumes:
  frontend_angular_cache:
  frontend_node_modules:
